services:
  intellij:
    build:
      context: .
      args:
        IDEA_VERSION: "${IDEA_VERSION:-2026.2.3}"
    hostname: ubuntu
    environment:
      PUID: "${PUID:?Run bash setup.sh first}"
      PGID: "${PGID:?Run bash setup.sh first}"
      TERMINAL_USER: "${SUDO_USER:-${USER:-ubuntu}}"
      TZ: "Asia/Karachi"
      CUSTOM_USER: "${WEBTOP_USER:-admin}"
      PASSWORD: "${WEBTOP_PASSWORD:?Run bash setup.sh first}"
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:3001:3001"
    shm_size: "1gb"
    cpus: "${IDEA_CPU_LIMIT:-0}"
    mem_limit: "${IDEA_MEMORY_LIMIT:-8g}"
    memswap_limit: "${IDEA_MEMORY_SWAP_LIMIT:-0}"
    restart: unless-stopped
