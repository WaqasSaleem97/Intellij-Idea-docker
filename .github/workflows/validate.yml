name: Validate IntelliJ image

on:
  push:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '*.sh'
      - '*.desktop'
      - '.dockerignore'
      - 'root/**'
      - 'keys/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '*.sh'
      - '*.desktop'
      - '.dockerignore'
      - 'root/**'
      - 'keys/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and launch (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check scripts and resource helpers
        run: |
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} \;
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check bundled PPA signing key
        run: |
          fingerprint="$(gpg --batch --show-keys --with-colons keys/xtradeb-apps.asc | awk -F: '$1 == "pub" { primary = 1 } $1 == "fpr" && primary { print $10; primary = 0 }')"
          test "$fingerprint" = '5301FA4FD93244FBC6F6149982BB6851C64F6880'
      - name: Check Compose configuration
        env:
          PUID: '1001'
          PGID: '1001'
          WEBTOP_PASSWORD: SmokeDemoOnly123
        run: |
          printf 'PUID=%s\nPGID=%s\nWEBTOP_PASSWORD=%s\n' "$PUID" "$PGID" "$WEBTOP_PASSWORD" > .env
          bash resources.sh --configure-only
          docker compose config --quiet
      - name: Build without Launchpad API or keyserver access
        run: |
          docker build --progress=plain \
            --add-host=api.launchpad.net:127.0.0.1 \
            --add-host=keyserver.ubuntu.com:127.0.0.1 \
            -t intellij-lean:ci .
      - name: Launch and check the desktop
        run: bash tests/smoke.sh intellij-lean:ci
